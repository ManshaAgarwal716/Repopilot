[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "Safe local repository scanner, explorer, and pre-PR diagnostic tool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "RepoPilot Contributors" },
]
keywords = ["developer-tools", "repository-scanner", "diagnostics", "cli", "git"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
repopilot = "repopilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
